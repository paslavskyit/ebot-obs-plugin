name: windows
on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: .github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo
      - uses: actions/upload-artifact@v4
        with:
          name: ebot-obs-windows
          path: release/
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -Wall -Isrc tests/core_test.cpp src/core.cpp -o core_test && ./core_test
